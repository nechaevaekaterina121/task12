<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Герой против голода</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@300;400;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --rope-color: #c8780a;
      --rope-width: 6px;
      --ceiling-color: #8b4a1e;
      --ceiling-glow: rgba(180,100,30,.65);

      --ui-bg: rgba(60, 28, 8, 0.72);
      --ui-stroke: rgba(255, 180, 60, 0.28);
      --text: #fff5e0;

      --accentA: #ffb830;
      --accentB: #ff7a00;

      --good: #5ddd3a;
      --bad: #ff4d4d;
    }


    /* ── Черновик ── */
    #draftPanel{
      position:absolute; left:12px; top:104px; z-index:12;
      display:none; flex-direction:column; gap:8px;
      width:min(340px, calc(100vw - 24px)); padding:10px;
      border:1px solid rgba(255,180,60,.48); border-radius:12px;
      background:rgba(35,17,7,.96); box-shadow:0 10px 32px #0009;
      pointer-events:auto;
    }
    #draftPanel.show{ display:flex; }
    #draftToggle{
      position:absolute; left:12px; top:58px; z-index:13;
      background:rgba(60,28,8,.92); border:1px solid rgba(255,180,60,.5);
      color:var(--text); border-radius:9px; padding:6px 11px;
      cursor:pointer; font-size:14px; pointer-events:auto;
      display:none;
    }
    #draftToggle.show{ display:block; }
    .draftHead{display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:14px}
    #draftClose{background:transparent;border:0;color:var(--text);font-size:22px;line-height:1;cursor:pointer;padding:0 4px}
    #draftCanvas{
      position:relative; inset:auto; z-index:auto; pointer-events:auto;
      display:block; width:100%; height:220px; flex:none;
      border-radius:8px; cursor:crosshair; touch-action:none;
      border:1px solid rgba(255,180,60,.45); background-color:#fffdf6;
    }
    #draftCanvas.paper-lines{background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 24px,#91b4d766 25px,#91b4d766 26px)}
    #draftCanvas.paper-grid{background-image:linear-gradient(#91b4d766 1px,transparent 1px),linear-gradient(90deg,#91b4d766 1px,transparent 1px);background-size:20px 20px}
    .draftTools{display:flex;gap:7px;justify-content:center}
    .draftBtn{background:rgba(60,28,8,.9);border:1px solid rgba(255,180,60,.4);color:var(--text);border-radius:8px;padding:6px 13px;cursor:pointer;font-size:14px}
    .draftBtn.active{background:rgba(255,180,60,.35);outline:2px solid #ffb830}

    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      font-family: "Roboto Condensed", ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      color:var(--text);
      background:#1a0a00;
      overflow:hidden;
    }

    .scene{
      width:100vw; height:100vh;
      position:relative; overflow:hidden;
      background:#1a0a00; isolation:isolate;
    }

    .bg{
      position:absolute; inset:0; z-index:0;
      background:
        radial-gradient(1200px 520px at 22% 20%, rgba(180,90,10,.12), transparent 60%),
        radial-gradient(1000px 700px at 80% 45%, rgba(220,130,20,.10), transparent 58%),
        #1a0a00;
    }
    .bg::before{
      content:"";
      position:absolute; inset:0;
      background-image:url("https://verevochka.lessonplaytaynayakartinka.ru/assets/background.webp");
      background-size:cover; background-position:center;
      opacity:1; filter:saturate(1.02) contrast(1.04);
    }
    .vignette{
      position:absolute; inset:0; z-index:1; pointer-events:none;
      background: radial-gradient(circle at 50% 30%, rgba(0,0,0,0) 30%, rgba(0,0,0,.40) 90%);
    }

    canvas{ position:absolute; inset:0; z-index:2; pointer-events:none; }

    #charGif{
      position:absolute; z-index:5;
      width:clamp(128px,16vh,200px); height:clamp(128px,16vh,200px);
      left:0; top:0;
      transform: translate(-50%, -50%);
      pointer-events:none; user-select:none; -webkit-user-drag:none;
      will-change: transform, left, top;
    }

    /* ── HUD ── */
    .hud{
      position:absolute; top:12px; left:12px; right:12px; z-index:6;
      display:grid; grid-template-columns: 1fr auto 1fr;
      align-items:center; gap:10px; pointer-events:none;
    }
    .hudLeft{ justify-self:start; display:flex; gap:8px; align-items:center; }
    .hudCenter{ justify-self:center; }
    .hudRight{ justify-self:end; display:flex; gap:8px; align-items:center; }

    /* карамельная таблетка */
    .pill{
      position:relative; display:flex; align-items:center; gap:7px;
      padding:8px 13px;
      background: linear-gradient(180deg, rgba(107,54,21,.94), rgba(51,24,13,.96));
      border: 1.5px solid rgba(255,177,64,.72);
      border-radius:10px 10px 14px 14px;
      backdrop-filter: blur(8px);
      box-shadow: 0 7px 18px rgba(0,0,0,.46), inset 0 1px 0 rgba(255,220,150,.18), inset 0 -4px 0 rgba(18,8,3,.25);
      font-weight:700; letter-spacing:.3px; white-space:nowrap;
      font-size:clamp(11px,1.4vh,15px);
    }
    .pill::before{
      content:""; position:absolute; left:50%; top:-10px; width:2px; height:10px;
      background:#d48a36; box-shadow:0 0 4px rgba(255,170,50,.5);
    }
    .pill::after{
      content:""; position:absolute; left:calc(50% - 2px); top:3px; width:4px; height:4px;
      border-radius:50%; background:#ffd27a; box-shadow:0 0 5px #ff9b27;
    }
    .dot{
      width:9px; height:9px; border-radius:50%;
      background: radial-gradient(circle at 35% 35%, #ffe066, #ff8c00);
      box-shadow: 0 0 6px rgba(255,160,0,.7);
      flex:0 0 auto;
    }
    .ok{ color: var(--good); text-shadow: 0 0 8px rgba(93,221,58,.5); }
    .no{ color: var(--bad);  text-shadow: 0 0 8px rgba(255,77,77,.5); }

    /* прогресс-полоска */
    .progressPill{ gap:10px; }
    .progressWrap{
      width:clamp(72px,16vw,180px); height:12px; border-radius:999px;
      background: rgba(35,13,5,.72);
      border:1px solid rgba(255,190,79,.55); overflow:hidden;
      box-shadow:inset 0 1px 4px rgba(0,0,0,.6), 0 0 8px rgba(255,140,22,.16);
    }
    .progressBar{
      height:100%; width:0%;
      background: linear-gradient(90deg, #ffe68a, #ffae22 55%, #ff641f);
      border-radius:999px; transition: width .35s ease;
      box-shadow:0 0 9px rgba(255,151,35,.85);
    }

    /* ── Панель внизу ── */
    .panel{
      position:absolute; left:8px; right:8px; bottom:90px; z-index:6;
      pointer-events:none; display:grid; grid-template-columns:1fr; gap:6px; align-items:end;
    }
    .ledgeRow{
      display:flex; justify-content:space-between; align-items:center;
      pointer-events:none; padding:0 2px;
    }
    #ledgeRow{ visibility:hidden; }
    .ledge{
      width:190px; height:18px; border-radius:12px;
      background: rgba(60,28,8,.45);
      border: 1px solid rgba(255,170,50,.22);
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 24px rgba(0,0,0,.25);
    }

    /* карточка вопроса */
    .card{
      background: linear-gradient(160deg, rgba(70,30,5,.88), rgba(45,18,3,.92));
      border: 1.5px solid rgba(255,160,40,.30);
      border-radius:20px; padding:16px;
      width:min(var(--question-card-width,780px),calc(100% - 16px));
      height:auto; min-height:var(--question-card-height,auto); overflow:auto;
      backdrop-filter: blur(14px);
      box-shadow: 0 16px 50px rgba(0,0,0,.40), inset 0 1px 0 rgba(255,200,80,.10);
      pointer-events:auto; max-width:none; margin:0 auto;
    }
    .qtitle{
      margin:0 0 8px 0; font-size:14px; opacity:.75;
      letter-spacing:.3px; font-weight:400; color: #ffd080;
    }
    .qtext{
      margin:0 0 14px 0; font-size:28px; line-height:1.2;
      font-weight:700; text-align:center;
      color: #fff5e0; text-shadow: 0 2px 8px rgba(0,0,0,.4);
    }
    .answers{
      display:grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap:10px;
    }
    .answers>.taskInstruction,.answers>.orderSelected,.answers>.orderChoices,.answers>.multiChoices,.answers>.categoryList,.answers>.errorSentence,.answers>.gapSentence,.answers>.openNote,.answers>.checkAnswerBtn{grid-column:1 / -1}
    .answers:has(>.orderSelected){gap:4px}.answers>.taskInstruction{margin:0 0 2px}.answers>.orderSelected,.answers>.orderChoices{margin:2px 0}.answers>.orderSelected .orderToken,.answers>.orderChoices .orderToken{padding:6px 12px}.answers>.checkAnswerBtn{margin-top:4px}
    .answerInputRow{grid-column:1 / -1;width:100%;display:flex;gap:10px;max-width:520px;margin:0 auto;}
    .answerInputRow input{
      min-width:0;flex:1;border-radius:14px;border:1.5px solid rgba(255,160,40,.35);
      background:rgba(28,14,7,.88);color:#fff5e0;padding:12px 16px;font:700 22px "Roboto Condensed",sans-serif;
      text-align:center;outline:none;box-shadow:inset 0 3px 10px rgba(0,0,0,.3);
    }
    .answerInputRow input:focus{border-color:#ffbd48;box-shadow:0 0 0 3px rgba(255,172,50,.16);}
    .answerInputRow .checkAnswerBtn{width:145px;flex:0 0 145px;min-width:145px;}
    .matchGrid{grid-column:1 / -1;width:100%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;max-width:640px;margin:0 auto;}
    .matchColumn{display:grid;gap:8px;}
    .matchBtn{font-size:clamp(17px,2.3vh,22px);padding:11px 8px;}
    .matchBtn.selected{border-color:#ffe083;background:linear-gradient(160deg,rgba(145,82,15,.95),rgba(83,39,5,.98));box-shadow:0 0 16px rgba(255,190,70,.45);}
    .matchBtn.matched{background:linear-gradient(160deg,rgba(30,120,20,.65),rgba(20,90,15,.75));border-color:rgba(93,221,58,.7);opacity:.8;}
    .matchBtn.pair-correct-flash{animation:matchCorrect .62s ease-in-out 2;z-index:1}.matchBtn.pair-wrong-flash{animation:matchWrong .55s ease-in-out;z-index:1}
    @keyframes matchCorrect{0%,100%{transform:scale(1)}45%{transform:scale(1.07);filter:brightness(1.45)}}
    @keyframes matchWrong{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
    @media(max-width:560px){
      .answerInputRow{flex-direction:column;}
      .answerInputRow .checkAnswerBtn{width:100%;flex:0 0 auto;}
      .matchBtn{font-size:17px;padding:10px 5px;}
    }
    .btn{
      width:100%; border:none; border-radius:14px; padding:14px 12px;
      color: #fff5e0; font-weight:700; cursor:pointer;
      background: linear-gradient(160deg, rgba(110,50,8,.75), rgba(70,28,4,.85));
      border: 1.5px solid rgba(255,160,40,.25);
      transition: background .08s, border-color .08s, filter .08s, transform .04s;
      text-align:center; font-family:"Roboto Condensed",sans-serif;
      letter-spacing:.2px; font-size:22px;
      -webkit-tap-highlight-color:transparent; outline:none;
      box-shadow: 0 4px 14px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,200,80,.08);
    }
    .btn:hover{
      background: linear-gradient(160deg, rgba(140,65,10,.82), rgba(90,38,5,.90));
      border-color: rgba(255,180,60,.45);
    }
    .btn:active{ transform: scale(0.98); filter: brightness(1.1); }
    .panel .btn.openContinueBtn{display:block!important;width:min(240px,100%)!important;margin:14px auto 0!important;justify-self:center}
    .btn.correct{
      background: linear-gradient(160deg, rgba(55,145,30,.88), rgba(25,91,15,.94));
      border-color: rgba(178,255,100,.88);
      box-shadow:0 0 20px rgba(129,255,60,.5), inset 0 1px 0 rgba(230,255,180,.4);
      animation:answerSpark .55s ease-in-out 2;
    }
    .btn.wrong{
      background: linear-gradient(160deg, rgba(170,30,16,.85), rgba(95,13,8,.92));
      border-color: rgba(255,115,70,.85);
      box-shadow:0 0 18px rgba(255,74,35,.38);
    }
    .questionImage{display:block;max-width:min(100%,560px);max-height:32vh;object-fit:contain;margin:8px auto 12px;border-radius:12px;box-shadow:0 4px 18px #0004}.card.feedback-good{animation:cardGlow .58s ease-out;}
    .card.feedback-bad{animation:cardRattle .48s ease-in-out;}
    @keyframes answerSpark{50%{filter:brightness(1.45);transform:translateY(-2px) scale(1.025)}}
    @keyframes cardGlow{0%{box-shadow:0 16px 50px rgba(0,0,0,.4)}45%{box-shadow:0 0 30px rgba(255,190,54,.65),0 16px 50px rgba(0,0,0,.4)}100%{box-shadow:0 16px 50px rgba(0,0,0,.4)}}
    @keyframes cardRattle{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
    .btn:disabled{ cursor:not-allowed; opacity:.9; }

    /* оверлей */
    #mistakeRetryStatus{margin:0 0 8px;font-size:14px;font-weight:700;text-align:center}
    .mistakeReview{text-align:left;margin:20px 0;border:1px solid currentColor;border-radius:12px;padding:12px;overflow-wrap:anywhere}
    .mistakeReview[hidden],.modalActions [hidden]{display:none!important}
    .mistakeReview summary{cursor:pointer;font-weight:700;padding:4px}
    .mistakeList{padding-left:24px;margin:12px 0 0}
    .mistakeList>li{margin:0 0 18px;padding:0 0 14px;border-bottom:1px solid currentColor}
    .mistakeList>li:last-child{margin-bottom:0;padding-bottom:0;border-bottom:0}
    .mistakeQuestion{font-size:18px;line-height:1.4;margin:0 0 8px;white-space:pre-wrap}
    .mistakeReview p,.mistakeReview ol{font-size:16px!important;line-height:1.45;margin:6px 0;white-space:pre-wrap}
    .mistakeReview ol{padding-left:24px}
    .mistakeImage{display:block;max-width:100%;max-height:180px;object-fit:contain;margin:8px 0;border-radius:8px}

    .overlay{
      position:fixed; inset:0; z-index:10;
      display:none; place-items:center; padding:20px; overflow:hidden;
      background: rgba(15,7,3,.62);
      backdrop-filter: blur(5px);
    }
    .overlay.show{ display:grid; }

    /* модальное окно */
    .modal{
      width:min(680px, 100%); min-height:0;
      max-height:calc(100vh - 40px); max-height:calc(100dvh - 40px);
      position:relative; overflow:auto; overscroll-behavior:contain;
      background:linear-gradient(160deg, rgba(76,34,17,.97), rgba(28,13,10,.98));
      border:2px solid rgba(243,153,47,.72);
      border-radius:24px; padding:28px 22px;
      box-shadow:0 30px 90px rgba(0,0,0,.72), inset 0 1px 0 rgba(255,200,80,.16), 0 0 28px rgba(255,118,20,.18);
      text-align:center;
    }
    #startOverlay .startModal{
      width:min(760px,100%); padding:20px 30px 28px;
      display:flex; flex-direction:column; align-items:center; gap:10px;
    }
    #startOverlay .startModal>*{flex-shrink:0}
    #titleCat{
      position:relative; left:auto; top:auto; transform:none;
      display:block; width:min(260px,38vh,62vw); height:min(230px,34vh);
      object-fit:contain; pointer-events:none; user-select:none;
      filter:drop-shadow(0 10px 20px rgba(0,0,0,.58));
      margin:0 auto 2px;
    }
    #startOverlay .startModal h1{margin:0;font-size:clamp(32px,5vw,48px)}
    #startOverlay .startModal p{max-width:560px;font-size:clamp(15px,2vw,19px)}
    #startOverlay .startModal .modalActions{margin-top:8px}
    #startOverlay .startModal .cta{min-width:210px;font-size:21px;padding:14px 30px}
    .modal h1{
      margin:0 0 10px 0; font-size:42px; line-height:1.05; overflow-wrap:anywhere;
      font-weight:700; letter-spacing:.2px;
      color:#ffe39a;
      text-shadow:0 3px 12px rgba(255,102,12,.62), 0 0 24px rgba(255,153,35,.2);
    }
    .modal p{
      margin:0; opacity:.85; line-height:1.5; overflow-wrap:anywhere;
      font-weight:400; font-size:15px; color:#ffd080;
    }
    .modalActions{
      margin-top:18px; display:flex; flex-wrap:wrap; justify-content:center; gap:10px; align-items:center; max-width:100%;
    }

    /* CTA кнопки */
    .cta{
      border:none; border-radius:16px; padding:13px 22px;
      font-weight:700; cursor:pointer;
      box-shadow: 0 6px 24px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,200,.25);
      transition: transform .08s, filter .08s;
      font-family:"Roboto Condensed",sans-serif; letter-spacing:.3px;
      font-size:20px; min-width:min(180px,100%); max-width:100%; overflow-wrap:anywhere;
    }
    .cta:hover{ transform: translateY(-2px); filter: brightness(1.07); }
    .cta:active{ transform: translateY(0); filter: brightness(.97); }
    .ctaPrimary{
      color: #3d1200;
      background: linear-gradient(160deg, #ffb830, #ff7a00);
      border: 1.5px solid rgba(255,220,80,.5);
      text-shadow: 0 1px 0 rgba(255,255,200,.3);
    }
    .ctaSecondary{
      background: rgba(255,255,255,.08);
      border: 1.5px solid rgba(255,170,50,.25);
      color: var(--text); box-shadow:none;
    }

    /* кнопка звука */
    .soundBtn{
      position:absolute; top:14px; right:14px;
      pointer-events:auto; cursor:pointer; user-select:none; z-index:20;
    }
  
    .taskInstruction,.openNote{margin:5px 0 10px;text-align:center;color:#ffe2a0;font-size:clamp(13px,1.7vh,17px)}
    .orderSelected,.orderChoices,.errorSentence{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;margin:8px 0}
    .orderSelected{min-height:44px;padding:7px;border:1px dashed rgba(255,220,150,.42);border-radius:10px}
    .orderToken,.errorWord{width:auto;flex:0 1 auto;min-width:58px;padding:8px 12px;font-size:clamp(15px,2vh,20px)}
    .multiChoices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.multiOption.selected{border-color:#ffe083;background:linear-gradient(160deg,rgba(145,82,15,.95),rgba(83,39,5,.98));box-shadow:0 0 14px rgba(255,190,70,.35)}
    .categoryList{display:grid;gap:7px}.categoryRow{display:grid;grid-template-columns:minmax(0,1fr) minmax(120px,.9fr);gap:8px;align-items:center;padding:6px 8px;border-radius:9px;background:rgba(30,12,3,.28);color:#fff5e0}.categoryRow select{min-width:0;padding:8px;border:1px solid rgba(255,190,79,.5);border-radius:8px;background:#271209;color:#fff5e0}
    .gapSentence{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:5px;font-size:clamp(16px,2.1vh,22px);line-height:1.7;text-align:center}.gapSentence input{width:clamp(72px,14vw,140px);max-width:100%;padding:5px 8px;border:1px solid #ffc45b;border-radius:7px;background:#fff8e8;color:#29190e;text-align:center;font:inherit}
    .checkAnswerBtn{width:auto;min-width:150px;display:block;margin:10px auto 0;padding:10px 18px;font-size:clamp(15px,1.9vh,19px)}
    @media(max-width:560px){.categoryRow{grid-template-columns:minmax(0,1fr) minmax(100px,.9fr)}.multiChoices{grid-template-columns:1fr}.orderToken,.errorWord{font-size:16px}}


    .resultImage{display:block;max-width:min(300px,72vw);max-height:190px;object-fit:contain;margin:0 auto 12px;border-radius:14px;filter:drop-shadow(0 8px 18px #0008)}
    .resultImage[hidden]{display:none!important}
    #winOverlay{isolation:isolate}
    #winEffect{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none}
    #winOverlay>.modal{position:relative;z-index:1}
    .effectHeart{position:absolute;bottom:-50px;font-size:clamp(22px,4vw,42px);animation:heartFloat var(--dur,3.2s) ease-in forwards;animation-delay:var(--delay,0s);filter:drop-shadow(0 2px 4px #0008)}
    @keyframes heartFloat{0%{transform:translateY(0) rotate(-12deg) scale(.65);opacity:0}12%{opacity:1}100%{transform:translateY(-115vh) rotate(18deg) scale(1.1);opacity:0}}
    .fireworkBurst{position:absolute;width:0;height:0}
    .fireworkBurst span{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--spark,#ffd76b);box-shadow:0 0 12px 3px var(--spark,#ffd76b);animation:sparkBurst 1.35s cubic-bezier(.12,.65,.28,1) forwards;animation-delay:var(--delay,0s)}
    @keyframes sparkBurst{0%{transform:translate(0,0) scale(.2);opacity:1}75%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}

  </style>
<style>.scene{width:min(100vw,177.7778vh);height:min(100vh,56.25vw);position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}:root{--question-card-width:725px;--question-card-height:170px;--question-card-x:49.7%;--question-card-y:100%}.panel{left:var(--question-card-x,50%);right:auto;top:var(--question-card-y,70%);bottom:auto;transform:translate(-50%,calc(-50% + var(--card-shift,0px)));width:min(var(--question-card-width,780px),calc(100% - 16px))}.panel>.card{width:100%}</style>

<body>
  <div class="scene" id="scene">
    <div class="bg"></div>
    <div class="vignette"></div>

    <canvas id="game"></canvas>

    <img id="charGif" alt="character" />

    <div class="hud">
      <div class="hudLeft">
        <div class="pill">
          <div class="dot"></div>
          <div>🍴 Раунд <span id="hudQ">1</span>/<span id="hudTotal">10</span></div>
        </div>
      </div>

      <div class="hudCenter">
        <div class="pill progressPill">
          <div class="progressWrap"><div class="progressBar" id="progBar"></div></div>
          <div><span id="progPct">0</span>%</div>
        </div>
      </div>

      <div class="hudRight">
        <div class="pill">
          <div>🐠 <span class="ok" id="hudOk">0</span></div>
          <div style="opacity:.4">|</div>
          <div id="hudHearts">🍭🍭🍭</div>
          <div style="opacity:.4">|</div>
          <div id="soundPill" style="cursor:pointer;pointer-events:auto;display:flex;align-items:center;gap:5px;" title="Звук">
            <div class="dot"></div>
            <div><span id="soundIcon">🔊</span> <span id="soundState">вкл</span></div>
          </div>
        </div>
      </div>
    </div>

    <div id="ledgeRow" style="position:absolute;left:12px;right:12px;z-index:3;display:flex;justify-content:space-between;align-items:center;pointer-events:none;">
      <div class="ledge" id="ledgeLeft"></div>
      <div class="ledge" id="ledgeRight"></div>
    </div>

    <div class="panel" id="panel">
      <div class="card">
        <p id="mistakeRetryStatus" hidden></p>
        <div class="qtitle" id="qtitle">Помоги коту добраться до угощения!</div>
        <div class="qtext" id="qtext">...</div>
        <div class="answers" id="answers"></div>
      </div>
    </div>

    
    <button id="draftToggle" type="button" aria-expanded="false">✏️ Черновик</button>
    <div id="draftPanel" aria-label="Черновик">
      <div class="draftHead"><span>Черновик</span><button id="draftClose" type="button" aria-label="Закрыть черновик">×</button></div>
      <canvas id="draftCanvas" class="paper-lines" width="640" height="440"></canvas>
      <div class="draftTools">
        <button class="draftBtn active" id="draftPencil">✏️</button>
        <button class="draftBtn" id="draftEraser">🧼</button>
        <button class="draftBtn" id="draftClear">🗑️</button>
      </div>
    </div>

    <div class="overlay" id="startOverlay">
      <div class="modal startModal">
        <img id="titleCat" alt="Чёрный кот из игры">
        <h1>🐈 Барсик против голода</h1>
        <p>Выполняй задания, прыгай по верёвкам и опереди сердитого повара!</p>
        <div class="modalActions">
          <button class="cta ctaPrimary" id="startBtn">Играть!</button>
        </div>
      </div>
    </div>

    <div class="overlay" id="overOverlay">
      <div class="modal">
        <img class="resultImage" id="loseResultImage" alt="Иллюстрация при проигрыше" hidden>
        <h1>😿 Повар поймал кота!</h1>
        <p id="overStats">Правильно: 2 · Ошибок: 3</p>
        <details class="mistakeReview" hidden><summary></summary><ol class="mistakeList"></ol></details>
        <div class="modalActions">
          <button class="cta ctaSecondary" id="retryLoseMistakesBtn" type="button" hidden>Повторить ошибки</button>
          <button class="cta ctaPrimary" id="restartBtn">Заново!</button>
          <button class="cta ctaSecondary" id="goBackBtn">Назад</button>
        </div>
      </div>
    </div>

    <div class="overlay" id="winOverlay">
      <div id="winEffect" aria-hidden="true"></div>
      <div class="modal">
        <img class="resultImage" id="winResultImage" alt="Иллюстрация при победе" hidden>
        <h1>🍬 Кот добрался до угощения!</h1>
        <p id="winStats">Правильно: 5 · Ошибок: 0</p>
        <details class="mistakeReview" hidden><summary></summary><ol class="mistakeList"></ol></details>
        <div class="modalActions">
          <button class="cta ctaSecondary" id="retryWinMistakesBtn" type="button" hidden>Повторить ошибки</button>
          <button class="cta ctaPrimary" id="playAgainBtn">Ещё раз!</button>
        </div>
      </div>
    </div>
  </div>

    function shuffleInPlace(arr){
      for(let i=arr.length-1;i>0;i--){

    function buildRunQuestions(source=QUESTIONS){
      const run = source.map(q => ({
        ...q,
        a: q.a ? [...q.a] : undefined,
        accepted: q.accepted ? [...q.accepted] : undefined,
        pairs: q.pairs ? q.pairs.map(pair => ({...pair})) : undefined
      }));

      if(SHUFFLE_QUESTIONS) shuffleInPlace(run);

      for(const item of run){
        if(item.a && item.type === "multi" && Array.isArray(item.correct)){
          const options = item.a.map((txt, idx) => ({ txt, idx }));
          shuffleInPlace(options);
          item.a = options.map(option => option.txt);
          item.correct = options.map((option, newIndex) => item.correct.includes(option.idx) ? newIndex : -1).filter(index => index >= 0);
        } else if(item.a && Number.isInteger(item.correct)){
          const options = item.a.map((txt, idx) => ({ txt, idx }));
          shuffleInPlace(options);
          item.a = options.map(option => option.txt);
          item.correct = options.findIndex(option => option.idx === item.correct);
        }
      }

      return run;
    }

      const sceneRect = scene.getBoundingClientRect();
      const ledgeRect = ledgeLeftEl.getBoundingClientRect();
      S.ledgeY = Math.floor(ledgeRect.top - sceneRect.top);
      S.ledgeW = Math.floor(ledgeRect.width);
      S.ledgeH = Math.floor(ledgeRect.height);

      const ledgeLeftRect = ledgeLeftEl.getBoundingClientRect();
      const ledgeRightRect = ledgeRightEl.getBoundingClientRect();
      S.ledgeLeftX = Math.floor(ledgeLeftRect.left - sceneRect.left);
      S.ledgeRightX = Math.floor(ledgeRightRect.left - sceneRect.left);

      buildAnchors();

      if(STATE.mode !== "play" || (STATE.i===0 && !character.attached && character.state==="stand")) placeCharacterOnLeftLedge();
      updateHUD();
      syncCharDom();
    }

    function buildAnchors(){
      const n = RUN_QUESTIONS.length;
      S.anchors = [];
      const startX = S.ledgeLeftX + S.ledgeW * 0.78;
      const endX   = S.ledgeRightX + S.ledgeW * 0.22;
      // каждой верёвке своя длина и скорость качания
      const ropeLengths = [0.85, 1.0, 0.72, 1.15, 0.90, 0.65, 1.05, 0.78, 1.0, 0.88, 0.70, 1.12, 0.82, 0.95, 0.75];
      const ropeFreqs   = [1.4, 1.1, 1.7, 0.9, 1.5, 1.2, 1.8, 1.0, 1.3, 1.6, 1.1, 0.85, 1.4, 1.2, 1.6];
      for(let k=0;k<n;k++){
        const t = (n===1)?0:(k/(n-1));
        const lenMult = ropeLengths[k % ropeLengths.length];
        const freq    = ropeFreqs[k % ropeFreqs.length];
        const layout = ROPE_LAYOUT[k] || { x: lerp(15, 85, t), y: 14, length: lenMult * 100 };
        S.anchors.push({
          x: Math.floor(S.w * clamp(Number(layout.x) || 0, 0, 100) / 100),
          y: Math.floor(S.h * clamp(Number(layout.y) || 0, 0, 100) / 100),
          lenMult: clamp(Number(layout.length) || 100, 10, 250) / 100,
          freq
        });
      }
    }

    function ropeSwingAngle(index){
      if(typeof ROPE_EDITOR_LAYOUT !== "undefined" && ROPE_EDITOR_LAYOUT.enabled && !ROPE_EDITOR_LAYOUT.animate) return 0;
      const t = performance.now() * 0.001;
      const amp  = 0.06;
      const spd  = 0.5;
      return -0.10 + Math.sin(t * heroEditorValue("swingSpeed",spd) + index * 0.85) * heroEditorValue("swingAmount",amp);
    }

    function ropeEndPos(index, angle){
      const a = S.anchors[index];
      const len = S.ropeLen * (a.lenMult || 1);
      return { x: a.x + Math.sin(angle) * len, y: a.y + Math.cos(angle) * len };
    }

    function standYOnLedge(){
      const feetOffset = 0.50;
      return (S.ledgeY + S.ledgeH) - HERO_STAND_SIZE * feetOffset;
    }

    function placeCharacterOnLeftLedge(){

    function bleep(freq=440, dur=0.08, type="sine", gain=0.03){
      if(!STATE.sound) return;
      try{
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        const t0 = audioCtx.currentTime;
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = type;
        o.frequency.setValueAtTime(freq, t0);
        g.gain.setValueAtTime(gain, t0);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(t0); o.stop(t0 + dur);
      } catch(e){}
    }

    function playNomSound(){

    function playFallSound(){
      if(!STATE.sound) return;
      try{
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        const t0 = audioCtx.currentTime;
        // вопль падения — глиссандо вниз
        [[440, 180, 0,    0.45, 0.12],
         [360, 130, 0.08, 0.40, 0.10],
         [280,  90, 0.18, 0.35, 0.09]].forEach(([fStart,fEnd,delay,dur,gain])=>{
          const o = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          o.type = "sawtooth";
          o.frequency.setValueAtTime(fStart, t0+delay);
          o.frequency.exponentialRampToValueAtTime(fEnd, t0+delay+dur);
          g.gain.setValueAtTime(gain, t0+delay);
          g.gain.exponentialRampToValueAtTime(0.0001, t0+delay+dur);
          o.connect(g); g.connect(audioCtx.destination);
          o.start(t0+delay); o.stop(t0+delay+dur+0.02);
        });
        // глухой удар при приземлении
        setTimeout(()=>{
          try{
            const t1 = audioCtx.currentTime;
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.type = "sine"; o.frequency.setValueAtTime(120, t1);
            o.frequency.exponentialRampToValueAtTime(40, t1+0.18);
            g.gain.setValueAtTime(0.25, t1);
            g.gain.exponentialRampToValueAtTime(0.0001, t1+0.18);
            o.connect(g); g.connect(audioCtx.destination);
            o.start(t1); o.stop(t1+0.2);
          } catch(e){}
        }, 420);
      } catch(e){}
    }

    function chooseAnswer(idx){
      if(STATE.mode !== "play") return;
      if(STATE.locked) return;
      STATE.locked = true;
      setAnswersEnabled(false);

      const item = RUN_QUESTIONS[STATE.i];
      const autoTypes = ["input", "matching", "order", "multi", "categories", "error", "gaps", "open"];
      const correct = autoTypes.includes(item.type) ? idx === 0 : idx === item.correct;
      if(!correct)recordMistake(item,idx);

      const btns = [...answersEl.querySelectorAll("button")];
      for(let j=0;j<btns.length;j++){
        const b = btns[j];
        if((correct || REVEAL_CORRECT) && item.type === "multi" && Array.isArray(item.correct) && item.correct.includes(j)) b.classList.add("correct");
        else if((correct || REVEAL_CORRECT) && !autoTypes.includes(item.type) && j === item.correct) b.classList.add("correct");
        if(j === idx && !correct) b.classList.add("wrong");
      }

      const card = document.querySelector(".card");
      card.classList.remove("feedback-good", "feedback-bad");
      void card.offsetWidth;
      card.classList.add(correct ? "feedback-good" : "feedback-bad");
      clearTimeout(feedbackTimer);
      feedbackTimer=setTimeout(() => card.classList.remove("feedback-good", "feedback-bad"), 650);

      if(correct){
        STATE.ok++;
        bleep(740, 0.06, "triangle", 0.04);
        bleep(988, 0.06, "triangle", 0.03);
        playNomSound();
        onCorrect();
      } else {
        STATE.no++;
        playFallSound();
        if(STATE.no >= 3){
          onWrong();
        } else {
          // персонаж остаётся в своей позе, но жизнь теряется
          STATE.locked = false;
          setAnswersEnabled(true);
        }
      }
      updateHUD();
    }

    function startTransferToRope(attachIndex, after){
      const from = { x: character.x, y: character.y };
      const endAngle = -0.10;
      const to = ropeEndPos(attachIndex, endAngle);

      character.state = "transfer";
      character.t = 0;
      character.from = from;
      character.to = to;
      character.attached = false;

      character.transferAttachIndex = attachIndex;
      character.transferAfter = after || null;

      character.transferLift = clamp(S.h * 0.028, 12, 28);
      character.transferStartAngle = character.angle || 0;
      character.transferEndAngle = endAngle;
      setCharImg(CHAR_FLY);
    }

    function startTransferToPlatform(platformPoint, after){
      character.state = "transfer";
      character.t = 0;
      character.from = { x: character.x, y: character.y };
      character.to = { x: platformPoint.x, y: platformPoint.y };
      character.attached = false;

      character.transferAttachIndex = null;
      character.transferAfter = after || null;

      character.transferLift = clamp(S.h * 0.022, 10, 22);
      character.transferStartAngle = character.angle || 0;
      character.transferEndAngle = 0;
      setCharImg(CHAR_FLY);
    }

    function finishTransfer(){
      if(character.transferAttachIndex !== null){
        character.ropeIndex = character.transferAttachIndex;
        character.attached = true;
        character.state = "swing";
        character.angle = character.transferEndAngle;
        const end = ropeEndPos(character.ropeIndex, character.angle);
        character.x = end.x; character.y = end.y;
        // съедаем сыр на верёвке при приземлении
        STATE.eatenRopes.add(character.ropeIndex);
        setCharImg(CHAR_EAT);
      } else {
        character.attached = false;
        character.state = "stand";
        character.angle = 0;
        character.x = character.to.x;
        character.y = character.to.y;
        setCharImg(CHAR_STAND);
      }

      const cb = character.transferAfter;
      character.transferAfter = null;
      character.transferAttachIndex = null;
      if(cb) cb();
    }

    function onCorrect(){
      const last = (STATE.i >= RUN_QUESTIONS.length - 1);

      if(!last && character.state === "stand" && !character.attached){
        startTransferToRope(0, () => {
          STATE.i++;
          renderQuestion();
          STATE.locked = false;
          setAnswersEnabled(true);
        });
        return;
      }

      if(!last){
        const nextIdx = clamp(character.ropeIndex + 1, 0, RUN_QUESTIONS.length - 1);
        startTransferToRope(nextIdx, () => {
          STATE.i++;
          renderQuestion();
          STATE.locked = false;
          setAnswersEnabled(true);
        });
        return;
      }

      const lastIndex = RUN_QUESTIONS.length - 1;

      const platform = {
        x: S.ledgeRightX + S.ledgeW * 0.75,
        y: standYOnLedge()
      };

      const goWin = () => {
        STATE.i = RUN_QUESTIONS.length;
        updateHUD();
        win();
      };
      const toPlatform = () => startTransferToPlatform(platform, goWin);

      const needLastRope = !(character.attached && character.state === "swing" && character.ropeIndex === lastIndex);

      if(needLastRope){
        startTransferToRope(lastIndex, toPlatform);
      } else {
        toPlatform();
      }
    }

    function spawnConfetti(count, x, y){
      for(let i=0;i<count;i++){
        const a = Math.random()*Math.PI*2;
        const sp = 1.2 + Math.random()*6.8;
        confetti.push({
          x: x + (Math.random()*14-7),
          y: y + (Math.random()*14-7),
          vx: Math.cos(a)*sp,
          vy: Math.sin(a)*sp - (3.0+Math.random()*2.8),
          r: 2 + Math.random()*4,
          rot: Math.random()*Math.PI*2,
          vr: (Math.random()*0.28 - 0.14),
          life: 1.0,
          hue: Math.floor(180 + Math.random()*160)

      }
    }

    function updateConfetti(dt){
      for(const p of confetti){
        p.vy += 9.2 * dt;
        p.x += p.vx * 60 * dt;
        p.y += p.vy * 60 * dt;
        p.rot += p.vr * 60 * dt;
        p.life -= 0.45 * dt;
      }
      confetti = confetti.filter(p => p.life > 0 && p.y < S.h + 50);
    }

    function drawConfetti(){
      for(const p of confetti){
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.globalAlpha = clamp(p.life, 0, 1);
        ctx.fillStyle = `hsl(${p.hue} 95% 65%)`;
        ctx.fillRect(-p.r, -p.r*0.6, p.r*2.2, p.r*1.2);
        ctx.restore();
      }
      ctx.globalAlpha = 1;
    }

    function drawRope(i){
      const a = S.anchors[i];

      let end;
      if(character.attached && character.state === "swing" && i === character.ropeIndex){
        end = { x: character.x, y: character.y };
      } else {
        end = ropeEndPos(i, ropeSwingAngle(i));
      }

      const midx = (a.x + end.x) / 2;
      const midy = (a.y + end.y) / 2 + 18;

      ctx.save();

      if(ropeVertImg.complete && ropeVertImg.naturalWidth > 0){
        const dx = end.x - a.x;
        const dy = end.y - a.y;
        const ropeLen = Math.sqrt(dx*dx + dy*dy);
        const w = 110;
        // матрица: направление от якоря к end, верёвка рисуется по этому вектору
        const cos = dy / ropeLen;
        const sin = dx / ropeLen;
        ctx.save();
        ctx.transform(cos, -sin, sin, cos, a.x, a.y);
        ctx.drawImage(ropeVertImg, -w/2, 0, w, ropeLen);
        ctx.restore();
      } else {
        ctx.strokeStyle = "#8b4a1e";
        ctx.lineWidth = 7;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.quadraticCurveTo(midx, midy, end.x, end.y);
        ctx.stroke();
      }

      ctx.restore();

      const s = 90;
      if(!STATE.eatenRopes.has(i)){
      ctx.save();
      ctx.translate(end.x, end.y);
      ctx.rotate(0 * Math.PI / 180);
      if(imgElem.complete && imgElem.naturalWidth > 0){
        ctx.drawImage(imgElem, -s/2, -s/2, s, s);
      } else {
        ctx.fillStyle = "rgba(255,255,255,.9)";
        ctx.beginPath();
        ctx.arc(0,0, s*0.26, 0, Math.PI*2);
        ctx.fill();
      }
      ctx.restore();
      }
    }

    function roundRect(ctx, x, y, w, h, r){
      r = Math.max(0, Math.min(r, w/2, h/2));
      ctx.moveTo(x+r, y);
      ctx.arcTo(x+w, y, x+w, y+h, r);
      ctx.arcTo(x+w, y+h, x, y+h, r);
      ctx.arcTo(x, y+h, x, y, r);
      ctx.arcTo(x, y, x+w, y, r);
      ctx.closePath();
    }

    function drawLedge(x, y, w, h){
      ctx.save();
      ctx.fillStyle = "rgba(0,0,0,.25)";
      ctx.beginPath();
      roundRect(ctx, x, y+8, w, h, 10);
      ctx.fill();

      ctx.fillStyle = "rgba(12, 14, 24, .34)";
      ctx.strokeStyle = "rgba(255,255,255,.18)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      roundRect(ctx, x, y, w, h, 10);
      ctx.fill();
      ctx.stroke();

      ctx.globalAlpha = .26;
      ctx.fillStyle = "rgba(255,255,255,.20)";
      ctx.beginPath();
      roundRect(ctx, x+8, y+3, w-16, 5, 8);
      ctx.fill();
      ctx.restore();
    }

    function update(dt){

          character.x = end.x;
          character.y = end.y;
        }

        if(character.state === "transfer"){
          character.t += dt;
          const T = 0.48;
          const u = clamp(character.t / T, 0, 1);
          const e = easeInOutCubic(u);

          character.x = lerp(character.from.x, character.to.x, e);
          character.y = lerp(character.from.y, character.to.y, e);

          const lift = Math.sin(u * Math.PI) * character.transferLift;
          character.y -= lift;

          character.angle = lerp(character.transferStartAngle, character.transferEndAngle, e);

          if(u >= 1){
            character.x = character.to.x;
            character.y = character.to.y;
            finishTransfer();
          }
        }

        if(character.state === "fall"){
          character.vy += 18 * dt;
          character.y += character.vy * 60 * dt;
          if(character.y > S.h + 220) character.y = S.h + 220;
        }
      }

      updateConfetti(dt);
      syncCharDom();
    }

    const originalChooseAnswer=chooseAnswer;chooseAnswer=function(index){const plain=!CUSTOM_SOUND_EFFECTS?.correct&&!CUSTOM_SOUND_EFFECTS?.wrong&&SOUND_PRESETS.correct==='standard'&&SOUND_PRESETS.wrong==='standard';if(plain){originalChooseAnswer(index);return}const ok=STATE.ok,no=STATE.no;bleep=()=>{};playNomSound=()=>{};playFallSound=()=>{};try{originalChooseAnswer(index)}finally{bleep=stdBleep;playNomSound=stdNom;playFallSound=stdFall}if(STATE.ok>ok)playEventSound('correct');else if(STATE.no>no)playEventSound('wrong')};
    const originalGameOver=gameOver;gameOver=function(){originalGameOver();playEventSound('lose')};
    const originalWin=win;win=function(){originalWin();playEventSound('win')};
    soundPill.addEventListener("click", () => {
      STATE.sound = !STATE.sound;
      updateSoundUI();
      if(STATE.sound) bleep(880,0.06,"triangle",0.03);
    });

    startBtn.addEventListener("click", () => {
      bleep(660, 0.03, "sine", 0.0001);
      startGame();
    });

    restartBtn.addEventListener("click", startGame);
    playAgainBtn.addEventListener("click", startGame);
    goBackBtn.addEventListener("click", goBackToLastQuestion);
    retryWinMistakesBtn.addEventListener("click", retryMistakes);
    retryLoseMistakesBtn.addEventListener("click", retryMistakes);

    hudTotal.textContent = RUN_QUESTIONS.length;
    updateSoundUI();
    resize();
    renderQuestion();
    requestAnimationFrame(loop);
    if(!SHOW_TITLE_PAGE){startOverlay.classList.remove("show");startGame();requestAnimationFrame(resize);window.addEventListener("load",resize,{once:true});if(window.ResizeObserver)new ResizeObserver(()=>resize()).observe(scene)}
